<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Listo, ya estás registrado</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { min-height: 100vh; display: grid; place-items: center; padding: 24px; text-align: center;
           font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #fff; color: #111; }
    h1 { font-size: 1.3rem; font-weight: 800; }
    p { margin: 10px 0 18px; color: #555; }
    a { display: inline-block; padding: 14px 22px; border-radius: 10px; background: #00b968; color: #04110a;
        font-weight: 800; text-decoration: none; }
    body.top { background: #050706; color: #f4f6f4; }
    body.top p { color: #a8b0ab; }
  </style>
</head>
<body>
  <main>
    <h1>Listo, ya estás registrado ✓</h1>
    <p id="msg">Un segundo…</p>
    <a id="wa" href="https://chat.whatsapp.com/LP6ExtDKGkCBbuErrKb9wy" style="display:none">Unirme al grupo de WhatsApp →</a>
  </main>

  <script>
    var WA = "https://chat.whatsapp.com/LP6ExtDKGkCBbuErrKb9wy";

    if (window.parent !== window) {
      /* Cargada DENTRO del formulario: avisa a la landing y ella abre WhatsApp en pestaña nueva. */
      try { window.parent.postMessage({ type: "masterclass-lead-ok" }, window.location.origin); } catch (e) {}
    } else {
      /* Abierta como página completa (GHL redirigió toda la ventana): directo al grupo. */
      document.body.className = "top";
      document.getElementById("msg").textContent = "Te llevo al grupo de WhatsApp…";
      document.getElementById("wa").style.display = "inline-block";

      setTimeout(function () { window.location.href = WA; }, 1500);
    }
  </script>
</body>
</html>
